name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the CLI runs from a packed tarball
        run: |
          tgz=$(npm pack -w @timedomain/aceworkflow --pack-destination "$RUNNER_TEMP" | tail -1)
          mkdir -p "$RUNNER_TEMP/packtest" && cd "$RUNNER_TEMP/packtest"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP/$tgz"
          npx aceworkflow --help
