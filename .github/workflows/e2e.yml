# The signing chain against a real backend: CLI → service → signed bundle →
# reference verifier. Everything else in the suite mocks the service, so this is
# the only job where a client/service disagreement can fail before a developer
# meets it — the kind that let the CLI ship for months unable to mint an
# identity or sign a scaffolded extension against any deployed environment.
#
# Deliberately not part of `validate`: that pipeline is reused by publish.yml on
# release tags and runs entirely offline, and a release must not become hostage
# to whether a backend happens to be up.
#
# No credential is involved. Ad-hoc signing is anonymous by design, so this
# needs only the target URL — a repository *variable*, because no non-production
# host is named in this public source. Unset (a fork, or before it is
# configured) means the job reports skipped rather than red.
name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Signing service to sign against (defaults to the ACEWORKFLOW_E2E_SERVICE variable)
        required: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Resolve the target service
        id: target
        env:
          FROM_INPUT: ${{ inputs.service }}
          FROM_VARIABLE: ${{ vars.ACEWORKFLOW_E2E_SERVICE }}
        run: |
          service="${FROM_INPUT:-$FROM_VARIABLE}"
          if [ -z "$service" ]; then
            echo "No ACEWORKFLOW_E2E_SERVICE configured — skipping the live signing check." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "service=$service" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign against the live service
        if: steps.target.outputs.skip != 'true'
        env:
          ACEWORKFLOW_E2E: "1"
          ACEWORKFLOW_E2E_SERVICE: ${{ steps.target.outputs.service }}
          # The developer id the fixture manifest declares, which is where an
          # ad-hoc identity is chosen (ADR 0098 §3). The mint is free and
          # anonymous, so the job needs no stored secret and no cross-run state;
          # ad-hoc slugs are non-unique by design, so re-minting is expected.
          ACEWORKFLOW_E2E_DEVELOPER_ID: aceworkflow-e2e
        run: npx vitest run packages/cli/test/sign.e2e.test.ts
