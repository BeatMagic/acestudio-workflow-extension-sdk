name: publish

# Stage every publishable workspace to npm on a release tag, via npm trusted publishing (OIDC):
# no long-lived token, and provenance is generated automatically. This uses STAGED publishing —
# CI can only queue a release; a maintainer must approve it (with 2FA) from a trusted device
# before it goes live. The trusted publisher for each package must be configured as stage-only on
# npmjs.com, so a plain `npm publish` from this workflow is rejected by the registry.
#
# `release-*`, not `v<semver>`: the workspaces carry independent version lines, so no single
# version is the tag's to name. A tag marks the moment, and the staging plan below is the record
# of what it released.

on:
  push:
    tags: ["release-*"]

permissions:
  id-token: write # OIDC for npm trusted publishing
  contents: read

jobs:
  # Gate the release on the same full pipeline CI runs, so a bad tag can't stage
  # a broken package.
  validate:
    uses: ./.github/workflows/_validate.yml

  stage:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      # Decide the whole release before staging any of it. Staging is a registry write, so a tag
      # that turns out to release nothing should fail while that is still cheap to say.
      #
      # Private packages (internal/fixtures) are skipped, and newly added public packages are
      # picked up automatically — but note each package name still needs its own stage-only
      # trusted publisher configured on npmjs.com before staging it can succeed.
      #
      # A package whose current version is already on the registry is skipped rather than
      # attempted. The workspace versions move independently, so most tags change only some of
      # them; without this the first unchanged package would be refused as a duplicate and take
      # the rest of the run down with it, leaving a release that is half staged for reasons the
      # log makes look like a registry fault. Skipping also makes a re-run of a partly failed
      # tag safe, which is the state you most want to be able to retry.
      - name: Plan the release
        id: plan
        run: |
          set -euo pipefail
          plan=""
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            # String(): a bare boolean gets ANSI-colored under FORCE_COLOR and would never match below.
            private=$(node -p "String(!!require('./${dir}package.json').private)")
            if [ "$private" = "true" ]; then
              echo "skip ${name} (private)"
              continue
            fi
            # `npm view` exits non-zero for an unpublished name as well as an unpublished
            # version, and both mean "go ahead", so only a clean exit is a reason to skip.
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "skip ${name}@${version} (already on the registry)"
              continue
            fi
            echo "plan ${name}@${version}"
            plan="${plan}${dir}"$'\n'
          done
          # Every version already live means the tag releases nothing. Left alone the loop below
          # would do no work and the run would go green, which reads as a release that happened.
          if [ -z "$plan" ]; then
            echo "::error::${GITHUB_REF_NAME} releases nothing — every publishable workspace is already on the registry. Bump a version, then tag."
            exit 1
          fi
          { echo "dirs<<EOF"; printf '%s' "$plan"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Stage the planned workspaces
        env:
          PLANNED_DIRS: ${{ steps.plan.outputs.dirs }}
        run: |
          set -euo pipefail
          while read -r dir; do
            [ -n "$dir" ] || continue
            echo "staging ${dir}"
            ( cd "$dir" && npm stage publish )
          done <<< "$PLANNED_DIRS"
