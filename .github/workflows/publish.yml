name: publish

# Stage every publishable workspace to npm on a release tag, via npm trusted publishing (OIDC):
# no long-lived token, and provenance is generated automatically. This uses STAGED publishing —
# CI can only queue a release; a maintainer must approve it (with 2FA) from a trusted device
# before it goes live. The trusted publisher for each package must be configured as stage-only on
# npmjs.com, so a plain `npm publish` from this workflow is rejected by the registry.
#
# `release-*`, not `v<semver>`: the workspaces carry independent version lines, so no single
# version is the tag's to name. A tag marks the moment, and the staging plan below is the record
# of what it released.

on:
  push:
    tags: ["release-*"]

permissions:
  id-token: write # OIDC for npm trusted publishing
  contents: read

jobs:
  # Gate the release on the same full pipeline CI runs, so a bad tag can't stage
  # a broken package.
  validate:
    uses: ./.github/workflows/_validate.yml

  stage:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the plan below reads package.json at the previous release tag

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      # Decide the whole release before staging any of it. Staging is a registry write, so a tag
      # that turns out to release nothing should fail while that is still cheap to say.
      #
      # Private packages (internal/fixtures) are skipped, and newly added public packages are
      # picked up automatically — but note each package name still needs its own stage-only
      # trusted publisher configured on npmjs.com before staging it can succeed.
      #
      # What a tag releases is whichever workspace versions it changed, so the plan is decided
      # from the repository: each version against the same version at the release before this
      # one. That earlier release is found through history rather than by tag name, because the
      # tags are dated and nothing in a date says which release came first.
      #
      # The versions move independently, so most tags change only some of them, and offering the
      # registry a version it already holds is refused — as `409 Cannot stage previously
      # published version`, which is also what it answers for a version that is merely staged
      # and still waiting for approval. Unfiltered, the first unchanged package takes the rest of
      # the run down with it, leaving a half-staged release for a reason the log dresses up as a
      # registry fault.
      #
      # The registry is still asked, but only about the workspaces that did change: that covers a
      # re-run of a tag whose staging was approved and published in the meantime.
      - name: Plan the release
        id: plan
        run: |
          set -euo pipefail
          previous=$(git describe --tags --match 'release-*' --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            echo "comparing versions against ${previous}"
          else
            echo "no earlier release tag — every publishable workspace counts as new"
          fi
          plan=""
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            # String(): a bare boolean gets ANSI-colored under FORCE_COLOR and would never match below.
            private=$(node -p "String(!!require('./${dir}package.json').private)")
            if [ "$private" = "true" ]; then
              echo "skip ${name} (private)"
              continue
            fi
            # A package added since the previous release has no package.json there, which leaves
            # `was` empty. Empty matches no version, so a new package is planned.
            if [ -n "$previous" ]; then
              was=$(git show "${previous}:${dir}package.json" 2>/dev/null \
                | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || true)
              if [ "$was" = "$version" ]; then
                echo "skip ${name}@${version} (unchanged since ${previous})"
                continue
              fi
            fi
            # `npm view` exits non-zero for an unpublished name as well as an unpublished
            # version, and both mean "go ahead", so only a clean exit is a reason to skip.
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "skip ${name}@${version} (already on the registry)"
              continue
            fi
            echo "plan ${name}@${version}"
            plan="${plan}${dir}"$'\n'
          done
          # No version moved means the tag releases nothing. Left alone the loop below would do no
          # work and the run would go green, which reads as a release that happened.
          if [ -z "$plan" ]; then
            echo "::error::${GITHUB_REF_NAME} releases nothing — no publishable workspace changed version since ${previous:-the start of history}. Bump a version, then tag."
            exit 1
          fi
          { echo "dirs<<EOF"; printf '%s' "$plan"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Stage the planned workspaces
        env:
          PLANNED_DIRS: ${{ steps.plan.outputs.dirs }}
        run: |
          set -euo pipefail
          while read -r dir; do
            [ -n "$dir" ] || continue
            echo "staging ${dir}"
            ( cd "$dir" && npm stage publish )
          done <<< "$PLANNED_DIRS"
